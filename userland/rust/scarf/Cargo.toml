[package]
name = "scarf"
description = "A small vim-style text editor with a file sidebar, for AnssOS"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Linked by scripts/build-userland.sh with crt0.o and the C libc -- see
# ../Cargo.toml.
[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
anssos.workspace = true
anssos-tui.workspace = true
ratatui.workspace = true
