[package]
name = "play"
description = "Interactive WAV/MP3 player for AnssOS"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Linked by scripts/build-userland.sh with crt0.o, the C libc and
# c/mp3.c (minimp3, vendor/minimp3/) -- see ../Cargo.toml.
[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
anssos.workspace = true
ratatui.workspace = true
