[package]
name = "sh"
description = "The AnssOS shell: suggestions, completion, highlighting, a two-line prompt"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Linked by scripts/build-userland.sh with crt0.o and the C libc -- see
# ../Cargo.toml. The kernel boots straight into it (/bin/sh).
[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
anssos.workspace = true
