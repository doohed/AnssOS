# AnssOS's Rust userland: one Cargo workspace, one lockfile, one target/.
#
#   anssos/  the runtime every Rust program links: FFI bindings to the C
#            libc (userland/libc.h), the global allocator (libc malloc),
#            and the panic handler. There is no Rust std for AnssOS.
#   tui/     anssos-tui: ratatui on AnssOS -- the console backend, plus
#            setup/teardown shared by full-screen programs.
#   play/    the WAV/MP3 player, built as a staticlib.
#   scarf/   the vim-style editor with a file sidebar, also a staticlib.
#   tile/    the terminal multiplexer (a VT per pane), also a staticlib.
#
# Programs are `staticlib`s, not Rust binaries: scripts/build-userland.sh
# links each one with crt0.o, the C libc and any C sources of its own,
# using the same userland/link.ld as every C program. crt0 calls the
# `main` the program exports. Build from anywhere with
#   cargo build --release --manifest-path userland/rust/Cargo.toml \
#       --config userland/rust/.cargo/config.toml
# or plain `cargo build --release` from inside this directory.
[workspace]
members = ["anssos", "tui", "play", "scarf", "tile"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anssos = { path = "anssos" }
anssos-tui = { path = "tui" }
# no_std: the default features pull in std (crossterm, layout cache, ...).
ratatui = { version = "0.30", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false
