# The AnssOS kernel -- see docs/architecture.md and docs/rust.md. Built as
# a static library for x86_64-unknown-none (.cargo/config.toml), which
# GNUmakefile links into the kernel ELF with linker.ld.
[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[lib]
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = "limited"
